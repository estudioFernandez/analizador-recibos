<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analizador de Recibos de Haberes</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f4f6fb; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const PASS = "Estudio2006";

    const SUMAR = {
      "001001":1,"001002":1,"001003":1,"022022":1,"005934":1,"005915":1,"001111":1,
      "930000":1,"931000":1,"932000":1,"001022":1,"001014":1,"0022011":1,"001020":1,
      "0022022":1,"001000":1,"001005":1,"088000":1,"135388":1,"135378":1,"095000":1,
      "088020":1,"135382":1,"005900":1,"001117":1,"114923":1,"15388":1,"001004":1,
      "135389":1,"135390":1,"135391":1,"135392":1,"135393":1,"135394":1,
      "135395":1,"135396":1,"135397":1,"135398":1,"135399":1,"135400":1
    };
    const NO_SUMAR = {
      "002001":1,"002000":1,"002020":1,"0098011":1,"06000":1,"05800":1,"318008":1,
      "940000":1,"941000":1,"942000":1,"102000":1,"809000":1,"709000":1,"19598":1,
      "319011":1,"518008":1,"30900":1,"14923":1,"060000":1,"005902":1,
      "116000":1,"123000":1
    };
    const RESTAR = {"204000":1,"195000":1};
    const ALERTAR = {"15388":1};

    function clasificar(cod, juzgado) {
      if (RESTAR[cod]) return "restar";
      if (ALERTAR[cod]) return "alerta_especial";
      if (cod === "005934") return juzgado === "2" ? "no_suma_excepcion" : "sumar";
      if (cod === "003900") return (juzgado === "1" || juzgado === "9") ? "no_suma_excepcion" : "sumar";
      if (SUMAR[cod]) return "sumar";
      if (NO_SUMAR[cod]) return "no_sumar";
      return "desconocido";
    }

    function parseMonto(raw) {
      if (/,\d{2}$/.test(raw)) return parseFloat(raw.replace(/\./g,"").replace(",","."));
      return parseFloat(raw.replace(/,/g,""));
    }

    const MESES = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

    function detectarPeriodo(linea) {
      const m1 = linea.match(/[Ff]echa\s+[Ll]iquidaci[oó]n\s*:?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m1) return m1[2].padStart(2,"0") + "/" + m1[3];
      for (let i = 0; i < MESES.length; i++) {
        const rx = new RegExp(MESES[i] + "\\s+(\\d{4})");
        const m2 = linea.match(rx);
        if (m2) return String(i+1).padStart(2,"0") + "/" + m2[1];
      }
      return null;
    }

    function parsearBloque(texto, juzgado) {
      const lineas = texto.split("\n");
      const items = [], alertas = [], vistos = {};
      let periodo = null;
      for (let i = 0; i < lineas.length; i++) {
        const l = lineas[i].trim();
        if (!l) continue;
        if (!periodo) periodo = detectarPeriodo(l);
        const mc2 = l.match(/^(\d{3})\s+(\d{3})\s+/);
        const mc1 = !mc2 ? l.match(/^(\d{5,8})\s+/) : null;
        let cod = null;
        if (mc2) cod = mc2[1] + mc2[2];
        else if (mc1) cod = mc1[1];
        if (!cod) continue;
        const reM = /(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/g;
        const found = [];
        let fx;
        while ((fx = reM.exec(l)) !== null) found.push(fx[0]);
        if (!found.length) continue;
        const monto = parseMonto(found[0]);
        if (isNaN(monto) || monto === 0) continue;
        const clase = clasificar(cod, juzgado);
        if (clase === "desconocido" && !vistos[cod]) {
          vistos[cod] = 1;
          alertas.push({tipo:"desconocido", cod, linea:l});
        } else if (clase === "alerta_especial") {
          alertas.push({tipo:"alerta_especial", cod, linea:l, monto});
        } else if (clase === "no_suma_excepcion") {
          alertas.push({tipo:"excepcion_juzgado", cod, linea:l, monto});
        }
        items.push({cod, monto, clase, linea:l});
      }
      const sumaTotal = items.reduce((a,it) => it.clase === "sumar" ? a + it.monto : a, 0);
      return {periodo, items, sumaTotal, alertas};
    }

    function dividirEnPeriodos(texto) {
      const bloques = texto.split(/(?=.*[Ff]echa\s+[Ll]iquidaci[oó]n)/);
      return bloques.filter(b => b.trim()).length > 0 ? bloques.filter(b => b.trim()) : [texto];
    }

    function parsePeriodo(p) {
      if (!p) return 0;
      const parts = p.split("/");
      return parseInt(parts[1]) * 100 + parseInt(parts[0]);
    }

    function fmt(n) {
      return n.toLocaleString("es-AR", {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function FilaCodigos({label, items, colorFn}) {
      if (items.length === 0) return null;
      return (
        <div style={{marginBottom:6, fontSize:13, lineHeight:1.8}}>
          <span style={{fontWeight:700, fontSize:12, marginRight:10}}>{label}</span>
          {items.map((it, k) => (
            <span key={k}>
              <span style={{fontWeight:700, color:colorFn(it)}}>{it.cod}</span>
              {" "}
              <span style={{color:colorFn(it)==="#1a6e2e"?"#1a6e2e":"#888", fontWeight:colorFn(it)==="#1a6e2e"?600:400}}>
                {"$"+fmt(it.monto)}
              </span>
              {k < items.length - 1 && <span style={{color:"#ccc", margin:"0 10px"}}>|</span>}
            </span>
          ))}
        </div>
      );
    }

    function Login({onOk}) {
      const [val, setVal] = useState("");
      const [err, setErr] = useState(false);
      const intentar = () => {
        if (val === PASS) onOk();
        else { setErr(true); setVal(""); }
      };
      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#f4f6fb"}}>
          <div style={{background:"white",borderRadius:12,padding:40,boxShadow:"0 4px 24px rgba(0,0,0,0.10)",minWidth:320,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:8}}>🔒</div>
            <h2 style={{marginBottom:4,color:"#1a1a2e"}}>Analizador de Recibos</h2>
            <p style={{color:"#666",fontSize:13,marginBottom:24}}>Ingresa la contrasena para continuar</p>
            <input type="password" placeholder="Contrasena" value={val}
              onChange={e=>{setVal(e.target.value);setErr(false);}}
              onKeyDown={e=>{if(e.key==="Enter")intentar();}}
              style={{width:"100%",padding:"10px 12px",border:"1px solid "+(err?"#e74c3c":"#ccc"),borderRadius:6,fontSize:15,marginBottom:8,outline:"none"}}
            />
            {err && <div style={{color:"#e74c3c",fontSize:13,marginBottom:8}}>Contrasena incorrecta</div>}
            <button onClick={intentar} style={{width:"100%",padding:"10px",background:"#1a1a2e",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>
              Ingresar
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [auth, setAuth] = useState(false);
      const [juzgado, setJuzgado] = useState("");
      const [texto, setTexto] = useState("");
      const [resultados, setResultados] = useState([]);

      if (!auth) return <Login onOk={()=>setAuth(true)} />;

      const hint = juzgado === "2" ? "Juzgado 2: 005934 NO se suma"
        : (juzgado === "1" || juzgado === "9") ? "Juzgado "+juzgado+": 003900 NO se suma" : "";

      const procesar = () => {
        if (!juzgado) { alert("Ingresa el numero de juzgado."); return; }
        if (!texto.trim()) { alert("Pega el texto del recibo primero."); return; }
        const bloques = dividirEnPeriodos(texto);
        const nuevos = bloques.map(b => parsearBloque(b, juzgado)).filter(r => r.items.length > 0);
        setResultados(nuevos.sort((a,b) => parsePeriodo(a.periodo) - parsePeriodo(b.periodo)));
      };

      const totalGeneral = resultados.reduce((a,r) => a + (r.sumaTotal||0), 0);
      const todasAlertas = resultados.reduce((acc,r) =>
        acc.concat((r.alertas||[]).map(a => ({...a, periodo:r.periodo}))), []);

      return (
        <div style={{fontFamily:"system-ui,sans-serif", padding:20, maxWidth:960, margin:"0 auto", color:"#1a1a2e"}}>
          <h2 style={{marginBottom:4}}>Analizador de Recibos de Haberes</h2>
          <p style={{color:"#666", fontSize:13, marginBottom:18}}>Abri el PDF, Ctrl+A, Ctrl+C y pega abajo.</p>

          <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14, flexWrap:"wrap"}}>
            <label style={{fontWeight:600, fontSize:14}}>Juzgado N:</label>
            <input value={juzgado} onChange={e=>setJuzgado(e.target.value)} placeholder="ej: 7"
              style={{width:80, padding:"6px 10px", border:"1px solid #ccc", borderRadius:6, fontSize:15}}/>
            {hint && <span style={{fontSize:12, color:"#b36a00", fontWeight:600}}>{hint}</span>}
          </div>

          <textarea value={texto} onChange={e=>setTexto(e.target.value)}
            placeholder="Pega aca el texto copiado del PDF..."
            style={{width:"100%", minHeight:120, padding:10, border:"1px solid #ccc", borderRadius:8, fontSize:12, fontFamily:"monospace", resize:"vertical", marginBottom:10}}
          />

          <div style={{display:"flex", gap:10, marginBottom:20}}>
            <button onClick={procesar} style={{padding:"9px 22px", background:"#1a1a2e", color:"white", border:"none", borderRadius:6, cursor:"pointer", fontWeight:700, fontSize:14}}>
              Analizar
            </button>
            {resultados.length > 0 &&
              <button onClick={()=>{setResultados([]);setTexto("");}}
                style={{padding:"8px 18px", background:"#c0392b", color:"white", border:"none", borderRadius:6, cursor:"pointer", fontWeight:600, fontSize:14}}>
                Limpiar
              </button>}
          </div>

          {todasAlertas.length > 0 && (
            <div style={{background:"#fff8e1", border:"1px solid #f0ad4e", borderRadius:8, padding:14, marginBottom:16}}>
              <strong style={{display:"block", marginBottom:8}}>Alertas que requieren revision manual:</strong>
              {todasAlertas.map((a,i) => (
                <div key={i} style={{fontSize:13, marginBottom:4}}>
                  <strong>{a.periodo}</strong> — Codigo <strong>{a.cod}</strong>:{" "}
                  {a.tipo==="desconocido" ? "No reconocido, revisar si se suma" :
                   a.tipo==="alerta_especial" ? "Consultar a Lean" :
                   "No suma por excepcion de juzgado"}
                </div>
              ))}
            </div>
          )}

          {resultados.map((r,i) => {
            const sumados = r.items.filter(it => it.clase === "sumar");
            const noSumados = r.items.filter(it => it.clase !== "sumar");
            return (
              <div key={i} style={{marginBottom:12, border:"1px solid #dde3f0", borderRadius:8, overflow:"hidden"}}>
                <div style={{background:"#1a1a2e", color:"white", padding:"8px 14px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:6}}>
                  <span style={{fontWeight:700, fontSize:15}}>{r.periodo||"-"}</span>
                  <span style={{fontWeight:700, fontSize:15}}>Total: {"$"+fmt(r.sumaTotal)}</span>
                  {r.alertas && r.alertas.length > 0
                    ? <span style={{background:"#e67e22", borderRadius:4, padding:"1px 8px", fontSize:12, fontWeight:700}}>{r.alertas.length} alerta{r.alertas.length>1?"s":""}</span>
                    : <span style={{background:"#1a6e2e", borderRadius:4, padding:"1px 8px", fontSize:12}}>OK</span>}
                </div>
                <div style={{padding:"10px 14px", background:"white"}}>
                  <FilaCodigos label="SE SUMAN:" items={sumados} colorFn={()=>"#1a6e2e"} />
                  <FilaCodigos label="NO SE SUMAN:" items={noSumados}
                    colorFn={(it) => it.clase==="desconocido"?"#e65100": it.clase==="alerta_especial"?"#f57f17": it.clase==="restar"?"#c62828":"#999"} />
                </div>
              </div>
            );
          })}

          {resultados.length > 0 && (
            <div style={{background:"#1a1a2e", color:"white", fontWeight:700, padding:"12px 16px", borderRadius:8, display:"flex", justifyContent:"space-between", fontSize:15}}>
              <span>TOTAL GENERAL</span>
              <span>{"$"+fmt(totalGeneral)}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
